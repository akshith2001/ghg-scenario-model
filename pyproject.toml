[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghg-scenario-model"
version = "0.5.1"
description = "Transparent cross-sector greenhouse-gas scenario modelling prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.10", "numpy>=2.0", "scipy>=1.13"]

[project.optional-dependencies]
synthetic = ["scikit-learn>=1.4"]

[project.scripts]
ghg-model = "ghg_model.cli:main"
ghg-chart = "ghg_model.chart:main"
ghg-optimize = "ghg_model.optimization:_cli"
ghg-water-case = "ghg_model.hospitality_water:main"
ghg-sensitivity = "ghg_model.sensitivity:main"
ghg-monte-carlo = "ghg_model.monte_carlo:main"
ghg-sciml = "ghg_model.sciml:main"
ghg-real-validation = "ghg_model.real_validation:main"
ghg-synthetic-grid = "ghg_model.synthetic_grid:main"

ghg-luxembourg = "ghg_model.luxembourg_case:main"

ghg-entsoe = "ghg_model.entsoe:main"

ghg-energycharts = "ghg_model.energycharts:main"

ghg-luxembourg-real = "ghg_model.real_case:main"

[tool.setuptools.packages.find]
where = ["src"]
