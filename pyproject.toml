[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghg-scenario-model"
version = "0.1.0"
description = "Transparent cross-sector greenhouse-gas scenario modelling prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.11"]

[project.scripts]
ghg-model = "ghg_model.cli:main"
ghg-chart = "ghg_model.chart:main"
ghg-water-case = "ghg_model.hospitality_water:main"
ghg-sensitivity = "ghg_model.sensitivity:main"

[tool.setuptools.packages.find]
where = ["src"]
