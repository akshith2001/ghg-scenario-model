[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghg-scenario-model"
version = "0.1.0"
description = "Transparent cross-sector greenhouse-gas scenario modelling prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ghg-model = "ghg_model.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
