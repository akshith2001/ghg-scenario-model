<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Monte Carlo distribution of potential annual emissions savings</title>
  <desc id="desc">Distribution from 10000 reproducible samples. The conditional fifth to ninety-fifth percentile range is 1440 to 3838 kilograms carbon dioxide equivalent.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#193043">Uncertainty in potential annual emissions savings</text>
  <text x="450" y="59" text-anchor="middle" font-family="Arial" font-size="13" fill="#555">10,000 independent triangular samples; seed 2026</text>
  <rect x="75.0" y="361.1" width="30.7" height="3.9" fill="#2A7F62"/><rect x="106.7" y="337.8" width="30.7" height="27.2" fill="#2A7F62"/><rect x="138.3" y="285.6" width="30.7" height="79.4" fill="#2A7F62"/><rect x="170.0" y="203.9" width="30.7" height="161.1" fill="#2A7F62"/><rect x="201.7" y="133.1" width="30.7" height="231.9" fill="#2A7F62"/><rect x="233.3" y="115.0" width="30.7" height="250.0" fill="#2A7F62"/><rect x="265.0" y="85.0" width="30.7" height="280.0" fill="#2A7F62"/><rect x="296.7" y="103.1" width="30.7" height="261.9" fill="#2A7F62"/><rect x="328.3" y="150.1" width="30.7" height="214.9" fill="#2A7F62"/><rect x="360.0" y="178.6" width="30.7" height="186.4" fill="#2A7F62"/><rect x="391.7" y="215.5" width="30.7" height="149.5" fill="#2A7F62"/><rect x="423.3" y="258.2" width="30.7" height="106.8" fill="#2A7F62"/><rect x="455.0" y="292.3" width="30.7" height="72.7" fill="#2A7F62"/><rect x="486.7" y="312.6" width="30.7" height="52.4" fill="#2A7F62"/><rect x="518.3" y="331.3" width="30.7" height="33.7" fill="#2A7F62"/><rect x="550.0" y="347.5" width="30.7" height="17.5" fill="#2A7F62"/><rect x="581.7" y="352.7" width="30.7" height="12.3" fill="#2A7F62"/><rect x="613.3" y="359.0" width="30.7" height="6.0" fill="#2A7F62"/><rect x="645.0" y="360.9" width="30.7" height="4.1" fill="#2A7F62"/><rect x="676.7" y="362.6" width="30.7" height="2.4" fill="#2A7F62"/><rect x="708.3" y="363.5" width="30.7" height="1.5" fill="#2A7F62"/><rect x="740.0" y="363.9" width="30.7" height="1.1" fill="#2A7F62"/><rect x="771.7" y="364.6" width="30.7" height="0.4" fill="#2A7F62"/><rect x="803.3" y="364.8" width="30.7" height="0.2" fill="#2A7F62"/>
  <line x1="169.2" y1="78" x2="169.2" y2="375" stroke="#9D5C63" stroke-width="3"/>
  <line x1="500.0" y1="78" x2="500.0" y2="375" stroke="#9D5C63" stroke-width="3"/>
  <line x1="75" y1="365" x2="835" y2="365" stroke="#455A64"/>
  <text x="169.2" y="398" text-anchor="middle" font-family="Arial" font-size="12" fill="#7A3F45">P5 1440</text>
  <text x="500.0" y="398" text-anchor="middle" font-family="Arial" font-size="12" fill="#7A3F45">P95 3838</text>
  <text x="450" y="435" text-anchor="middle" font-family="Arial" font-size="13" fill="#333">Potential annual emissions saving (kg CO2e)</text>
  <text x="450" y="466" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">Conditional range reflects assumed inputs; it is not a measured confidence interval.</text>
</svg>