<svg xmlns="http://www.w3.org/2000/svg" width="900" height="536" viewBox="0 0 900 536" role="img" aria-labelledby="title desc">
  <title id="title">One-at-a-time sensitivity of annual emissions savings</title>
  <desc id="desc">Parameters ranked by the maximum percentage change in calculated emissions savings after a plus or minus ten percent input change.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#193043">Sensitivity of annual emissions savings</text>
  <text x="450" y="59" text-anchor="middle" font-family="Arial" font-size="13" fill="#555">One input varied at a time; default range ±10%</text>
  <line x1="520" y1="76" x2="520" y2="508" stroke="#455A64" stroke-width="1"/>
  <text x="300" y="103" text-anchor="end" font-family="Arial" font-size="15" fill="#263238">Heater efficiency</text><rect x="318.6" y="85" width="447.5" height="24" rx="4" fill="#2A7F62"/><text x="310.6" y="103" text-anchor="end" font-family="Arial" font-size="12" fill="#444">+10.3%</text><text x="774.1" y="103" font-family="Arial" font-size="12" fill="#444">-8.4%</text><text x="300" y="155" text-anchor="end" font-family="Arial" font-size="15" fill="#263238">Tap flow</text><rect x="280.0" y="137" width="480.0" height="24" rx="4" fill="#2A7F62"/><text x="272.0" y="155" text-anchor="end" font-family="Arial" font-size="12" fill="#444">-10.0%</text><text x="768.0" y="155" font-family="Arial" font-size="12" fill="#444">+10.0%</text><text x="300" y="207" text-anchor="end" font-family="Arial" font-size="15" fill="#263238">Running time</text><rect x="280.0" y="189" width="480.0" height="24" rx="4" fill="#2A7F62"/><text x="272.0" y="207" text-anchor="end" font-family="Arial" font-size="12" fill="#444">-10.0%</text><text x="768.0" y="207" font-family="Arial" font-size="12" fill="#444">+10.0%</text><text x="300" y="259" text-anchor="end" font-family="Arial" font-size="15" fill="#263238">Operating days</text><rect x="280.0" y="241" width="480.0" height="24" rx="4" fill="#2A7F62"/><text x="272.0" y="259" text-anchor="end" font-family="Arial" font-size="12" fill="#444">-10.0%</text><text x="768.0" y="259" font-family="Arial" font-size="12" fill="#444">+10.0%</text><text x="300" y="311" text-anchor="end" font-family="Arial" font-size="15" fill="#263238">Avoidable-use reduction</text><rect x="280.0" y="293" width="480.0" height="24" rx="4" fill="#2A7F62"/><text x="272.0" y="311" text-anchor="end" font-family="Arial" font-size="12" fill="#444">-10.0%</text><text x="768.0" y="311" font-family="Arial" font-size="12" fill="#444">+10.0%</text><text x="300" y="363" text-anchor="end" font-family="Arial" font-size="15" fill="#263238">Hot-water share</text><rect x="298.5" y="345" width="443.1" height="24" rx="4" fill="#2A7F62"/><text x="290.5" y="363" text-anchor="end" font-family="Arial" font-size="12" fill="#444">-9.2%</text><text x="749.5" y="363" font-family="Arial" font-size="12" fill="#444">+9.2%</text><text x="300" y="415" text-anchor="end" font-family="Arial" font-size="15" fill="#263238">Temperature rise</text><rect x="298.5" y="397" width="443.1" height="24" rx="4" fill="#2A7F62"/><text x="290.5" y="415" text-anchor="end" font-family="Arial" font-size="12" fill="#444">-9.2%</text><text x="749.5" y="415" font-family="Arial" font-size="12" fill="#444">+9.2%</text><text x="300" y="467" text-anchor="end" font-family="Arial" font-size="15" fill="#263238">Heating emission factor</text><rect x="298.5" y="449" width="443.1" height="24" rx="4" fill="#2A7F62"/><text x="290.5" y="467" text-anchor="end" font-family="Arial" font-size="12" fill="#444">-9.2%</text><text x="749.5" y="467" font-family="Arial" font-size="12" fill="#444">+9.2%</text>
  <text x="520" y="528" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">Percentage change from base-case emissions saving</text>
</svg>